# Personal Tutor deployment. Only the chat provider needs user credentials.

name: morphic-stack
x-tutor-environment: &tutor-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-morphic}:${POSTGRES_PASSWORD:-morphic}@postgres:5432/${POSTGRES_DB:-morphic}
  DATABASE_RESTRICTED_URL: postgresql://${POSTGRES_USER:-morphic}:${POSTGRES_PASSWORD:-morphic}@postgres:5432/${POSTGRES_DB:-morphic}
  DATABASE_SSL_DISABLED: 'true'
  LOCAL_REDIS_URL: redis://redis:6379
  TUTOR_REDIS_URL: redis://redis:6379
  TUTOR_STORAGE_DRIVER: local
  TUTOR_LOCAL_STORAGE_DIR: /app/tutor-data
  TUTOR_EMBEDDING_AUTH: none
  TUTOR_EMBEDDING_BASE_URL: http://tutor-embedding:11434/v1
  TUTOR_EMBEDDING_MODEL: bge-m3
  TUTOR_EMBEDDING_DIMENSIONS: '1024'
  TUTOR_EMBEDDING_SEND_DIMENSIONS: 'false'
  # Small batches and a longer timeout also work on machines without a GPU.
  TUTOR_EMBEDDING_BATCH_SIZE: ${TUTOR_EMBEDDING_BATCH_SIZE:-4}
  TUTOR_EMBEDDING_TIMEOUT_MS: ${TUTOR_EMBEDDING_TIMEOUT_MS:-180000}
  TUTOR_RERANK_ENABLED: ${TUTOR_RERANK_ENABLED:-true}
  TUTOR_RERANK_AUTH: none
  TUTOR_RERANK_BASE_URL: http://tutor-reranker:8080/v1
  TUTOR_RERANK_MODEL: BAAI/bge-reranker-v2-m3

services:
  morphic:
    image: ${MORPHIC_IMAGE:-morphic:tutor-local}
    command: npx next start -H 0.0.0.0
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.local # Load environment variables
    environment:
      <<: *tutor-environment
      # Authentication settings (default: disabled for personal Docker use)
      ENABLE_AUTH: ${ENABLE_AUTH:-false}
      ANONYMOUS_USER_ID: ${ANONYMOUS_USER_ID:-docker-anonymous}
      # Better Auth and SMTP settings are deliberately NOT declared here:
      # `environment` entries override `env_file`, and ${VAR} interpolation
      # reads the shell or a project .env file — never .env.local. Declaring
      # them with empty defaults would wipe the values users put in
      # .env.local. Configure AUTH_PROVIDER, BETTER_AUTH_SECRET,
      # AUTH_SIGNUP_MODE, BOOTSTRAP_ADMIN_EMAIL and SMTP_* in .env.local
      # (see "Better Auth" in docs/CONFIGURATION.md).
      MORPHIC_CLOUD_DEPLOYMENT: 'false'
      # Docker-internal service URLs
      SEARCH_API: ${SEARCH_API:-searxng}
      SEARXNG_API_URL: ${SEARXNG_API_URL:-http://searxng:8080}
      # Version footer / update check (all optional, see docs/CONFIGURATION.md)
      # MORPHIC_INSTALL_METHOD: docker # Footer label; the image already sets this
      # MORPHIC_UPDATE_CHECK_REPO: miurla/morphic # Upstream repo to check (default: miurla/morphic)
      # MORPHIC_UPDATE_CHECK_TTL_SECONDS: '86400' # Check cache window in seconds (default: 86400, floor 300)
      # MORPHIC_UPDATE_CHECK_DISABLED: 'false' # Set to 'true' to skip upstream requests entirely
      # MORPHIC_ADMIN_EMAILS: 'ops@example.com' # Extra admin emails for the update link (providers without roles)
    ports:
      - '3000:3000' # Maps port 3000 on the host to port 3000 in the container.
    volumes:
      - tutor_data:/app/tutor-data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      tutor-embedding:
        condition: service_healthy
      tutor-reranker:
        condition: service_started
      searxng:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-morphic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-morphic}
      POSTGRES_DB: ${POSTGRES_DB:-morphic}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-morphic}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory-policy noeviction

  tutor-worker:
    image: ${MORPHIC_IMAGE:-morphic:tutor-local}
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ['node', '--import', 'tsx', 'scripts/tutor-worker.ts']
    env_file: .env.local
    environment:
      <<: *tutor-environment
    volumes:
      - tutor_data:/app/tutor-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      morphic:
        condition: service_healthy
      tutor-embedding:
        condition: service_healthy
      tutor-reranker:
        condition: service_started
    restart: unless-stopped

  tutor-embedding:
    image: ${TUTOR_EMBEDDING_IMAGE:-tutor-embedding:bge-m3}
    build:
      context: ./docker/embedding
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_KEEP_ALIVE: '-1'
    # Weights are inside the image at /opt/tutor-models. Do not mount a volume
    # there: an existing volume would hide newer model layers after an upgrade.
    healthcheck:
      test: ['CMD', 'ollama', 'show', 'bge-m3']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  tutor-reranker:
    image: tutor-reranker:bge-v2-m3-q8
    build:
      context: ./docker/reranker
    command:
      - --model
      - /models/bge-reranker-v2-m3-Q8_0.gguf
      - --alias
      - BAAI/bge-reranker-v2-m3
      - --host
      - '0.0.0.0'
      - --port
      - '8080'
      - --reranking
      - --ctx-size
      - '4096'
      - --batch-size
      - '4096'
      - --ubatch-size
      - '4096'
      - --parallel
      - '1'
      - --threads
      - '${TUTOR_RERANK_THREADS:-8}'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  searxng:
    image: searxng/searxng
    ports:
      - '${SEARXNG_PORT:-8080}:8080'
    volumes:
      - ./searxng-limiter.toml:/etc/searxng/limiter.toml
      - ./searxng-settings.yml:/etc/searxng/settings.yml
      - searxng_data:/data

volumes:
  postgres_data:
  redis_data:
  searxng_data:
  tutor_data:
